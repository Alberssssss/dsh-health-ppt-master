<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- 背景 -->
  <rect width="1280" height="720" fill="#FFFFFF"/>

  <!-- 页眉 -->
  <rect x="0" y="0" width="1280" height="70" fill="#0066B3"/>
  <rect x="0" y="0" width="6" height="70" fill="#00A86B"/>
  <text x="40" y="46" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="26"
    font-weight="bold">{{SECTION_NUM}} {{PAGE_TITLE}}</text>
  <!-- 徽标（右上角） -->
  <g id="emblem" transform="translate(1198,21)">
    <rect width="28" height="28" rx="7" fill="#FFFFFF" fill-opacity="0.18"/>
    <rect x="12" y="6" width="4" height="16" rx="2" fill="#FFFFFF"/>
    <rect x="6" y="12" width="16" height="4" rx="2" fill="#FFFFFF"/>
  </g>

  <!-- 核心 / take-home 条 -->
  <rect x="0" y="70" width="1280" height="50" fill="#E6F6EF"/>
  <rect x="0" y="70" width="6" height="50" fill="#00A86B"/>
  <text x="40" y="102" fill="#0066B3" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18">{{KEY_MESSAGE}}</text>

  <!-- 内容区域：承载数据卡 / timeline / 图随报告 -->
  <rect x="40" y="135" width="1200" height="515" fill="#FFFFFF" rx="4"/>
  <rect x="40" y="135" width="1200" height="515" fill="none" stroke="#D5E2EE" stroke-width="1" rx="4"
    stroke-dasharray="8,4"/>
  <text x="640" y="380" text-anchor="middle" fill="#C3D2E0" font-family="Microsoft YaHei, Arial, sans-serif"
    font-size="16">{{CONTENT_AREA}}</text>
  <text x="640" y="410" text-anchor="middle" fill="#C3D2E0" font-family="Microsoft YaHei, Arial, sans-serif"
    font-size="14">建议布局：生命体征数据卡、诊疗 timeline、鉴别诊断对比表、图随报告</text>

  <!-- 页脚 -->
  <line x1="40" y1="665" x2="1240" y2="665" stroke="#D5E2EE" stroke-width="1"/>
  <text x="40" y="695" fill="#9AA7B2" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12">来源：{{SOURCE}}</text>
  <text x="640" y="695" text-anchor="middle" fill="#9AA7B2" font-family="Microsoft YaHei, Arial, sans-serif"
    font-size="12">{{SECTION_NAME}}</text>
  <text x="1220" y="695" text-anchor="end" fill="#5A6B7B" font-family="Microsoft YaHei, Arial, sans-serif"
    font-size="14">{{PAGE_NUM}}</text>
</svg>
