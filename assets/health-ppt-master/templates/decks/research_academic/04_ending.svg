<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- 背景 -->
  <rect width="1280" height="720" fill="#FFFFFF"/>

  <!-- 顶部细装饰 -->
  <rect x="0" y="0" width="1280" height="10" fill="#1A3A5C"/>
  <rect x="0" y="0" width="240" height="10" fill="#0E8C8C"/>

  <!-- 通用医疗徽标（脉搏，居中，较大） -->
  <g id="emblem" transform="translate(600,150)">
    <rect width="80" height="80" rx="18" fill="#0E8C8C"/>
    <path d="M16 42 H30 L36 24 L46 58 L52 42 H64" fill="none" stroke="#FFFFFF" stroke-width="5"
      stroke-linejoin="round" stroke-linecap="round"/>
  </g>

  <!-- 感谢语 -->
  <text x="640" y="312" text-anchor="middle" fill="#1A3A5C" font-family="Microsoft YaHei, Arial, sans-serif"
    font-size="50" font-weight="bold">{{THANK_YOU}}</text>

  <!-- take-home / 副标语 -->
  <text x="640" y="362" text-anchor="middle" fill="#5A6B7B" font-family="Microsoft YaHei, Arial, sans-serif"
    font-size="22">{{ENDING_SUBTITLE}}</text>

  <!-- 装饰分割线 + 数据节点 -->
  <line x1="470" y1="402" x2="810" y2="402" stroke="#1A3A5C" stroke-width="1.5"/>
  <circle cx="640" cy="402" r="6" fill="#0E8C8C"/>

  <!-- 致谢 / 利益冲突 / 单位信息卡 -->
  <rect x="340" y="438" width="600" height="150" fill="#F4F7F9" rx="8"/>
  <rect x="340" y="438" width="6" height="150" fill="#0E8C8C" rx="3"/>
  <text x="640" y="488" text-anchor="middle" fill="#1A3A5C" font-family="Microsoft YaHei, Arial, sans-serif"
    font-size="20" font-weight="bold">{{INSTITUTION}}</text>
  <text x="640" y="526" text-anchor="middle" fill="#1F2937" font-family="Microsoft YaHei, Arial, sans-serif"
    font-size="16">{{DEPARTMENT}}</text>
  <text x="640" y="561" text-anchor="middle" fill="#5A6B7B" font-family="Microsoft YaHei, Arial, sans-serif"
    font-size="14">{{CONTACT_INFO}}</text>

  <!-- 页脚 -->
  <rect x="0" y="672" width="1280" height="48" fill="#F4F7F9"/>
  <text x="640" y="702" text-anchor="middle" fill="#9AA7B2" font-family="Microsoft YaHei, Arial, sans-serif"
    font-size="13">Disclosure / 利益冲突声明：{{ENDING_SUBTITLE}}　｜　{{PAGE_NUM}}</text>
</svg>
