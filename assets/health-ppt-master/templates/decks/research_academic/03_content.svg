<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- 背景 -->
  <rect width="1280" height="720" fill="#FFFFFF"/>

  <!-- 页眉 -->
  <rect x="0" y="0" width="1280" height="70" fill="#1A3A5C"/>
  <rect x="0" y="0" width="6" height="70" fill="#0E8C8C"/>
  <text x="40" y="46" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="26"
    font-weight="bold">{{SECTION_NUM}} {{PAGE_TITLE}}</text>
  <g id="emblem" transform="translate(1198,21)">
    <rect width="28" height="28" rx="7" fill="#FFFFFF" fill-opacity="0.18"/>
    <path d="M6 15 H11 L13.5 8 L18 22 L20.5 15 H23" fill="none" stroke="#FFFFFF" stroke-width="2"
      stroke-linejoin="round" stroke-linecap="round"/>
  </g>

  <!-- 核心发现 / take-home 条 -->
  <rect x="0" y="70" width="1280" height="50" fill="#E3F1F1"/>
  <rect x="0" y="70" width="6" height="50" fill="#0E8C8C"/>
  <text x="40" y="102" fill="#1A3A5C" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18">{{KEY_MESSAGE}}</text>

  <!-- 内容区域：为承载一张主图（KM/forest/ROC/CONSORT）+ 文字而设计 -->
  <rect x="40" y="135" width="1200" height="515" fill="#FFFFFF" rx="4"/>
  <rect x="40" y="135" width="1200" height="515" fill="none" stroke="#DCE3EA" stroke-width="1" rx="4"
    stroke-dasharray="8,4"/>
  <text x="640" y="380" text-anchor="middle" fill="#C9D2DC" font-family="Microsoft YaHei, Arial, sans-serif"
    font-size="16">{{CONTENT_AREA}}</text>
  <text x="640" y="410" text-anchor="middle" fill="#C9D2DC" font-family="Microsoft YaHei, Arial, sans-serif"
    font-size="14">建议布局：单图 + take-home、双栏对比、入组流程(CONSORT)、基线数据卡</text>

  <!-- 页脚 -->
  <line x1="40" y1="665" x2="1240" y2="665" stroke="#DCE3EA" stroke-width="1"/>
  <text x="40" y="695" fill="#9AA7B2" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12">来源/引用：{{SOURCE}}</text>
  <text x="640" y="695" text-anchor="middle" fill="#9AA7B2" font-family="Microsoft YaHei, Arial, sans-serif"
    font-size="12">{{SECTION_NAME}}</text>
  <text x="1220" y="695" text-anchor="end" fill="#5A6B7B" font-family="Microsoft YaHei, Arial, sans-serif"
    font-size="14">{{PAGE_NUM}}</text>
</svg>
