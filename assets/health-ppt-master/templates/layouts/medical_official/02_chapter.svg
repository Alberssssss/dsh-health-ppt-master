<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
    <!-- 背景：深机构蓝 -->
    <rect width="1280" height="720" fill="#0C2342" />

    <!-- 右侧几何装饰 -->
    <path d="M900 0 L1280 0 L1280 720 L700 720 Z" fill="#13315C" fill-opacity="0.6" />
    <rect x="1210" y="0" width="70" height="720" fill="#B5121B" fill-opacity="0.18" />

    <!-- 左侧红装饰条 -->
    <rect x="0" y="260" width="12" height="200" fill="#B5121B" />

    <!-- 章节编号：大号半透明 -->
    <text x="110" y="490" fill="#FFFFFF" fill-opacity="0.07" font-family="Microsoft YaHei, Arial, sans-serif"
        font-size="280" font-weight="bold">
        {{CHAPTER_NUM}}
    </text>

    <!-- 红装饰线 -->
    <line x1="380" y1="278" x2="520" y2="278" stroke="#B5121B" stroke-width="6" />

    <!-- 章节标题 -->
    <text x="380" y="362" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="52"
        font-weight="bold">
        {{CHAPTER_TITLE}}
    </text>

    <!-- 章节描述 -->
    <text x="380" y="422" fill="#C5D0DE" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22">
        {{CHAPTER_DESC}}
    </text>

    <!-- 底部信息 -->
    <line x1="40" y1="665" x2="1240" y2="665" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.1" />
    <text x="1240" y="690" text-anchor="end" fill="#FFFFFF" fill-opacity="0.4"
        font-family="Microsoft YaHei, Arial, sans-serif" font-size="16">
        {{INSTITUTION}}
    </text>
</svg>
