<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
    <!-- 背景 -->
    <rect width="1280" height="720" fill="#FFFFFF" />

    <!-- 顶部细装饰 -->
    <rect x="0" y="0" width="1280" height="8" fill="#1A3A5C" />
    <rect x="0" y="0" width="220" height="8" fill="#0E8C8C" />

    <text x="1240" y="60" text-anchor="end" fill="#5A6B7B" font-family="Microsoft YaHei, Arial, sans-serif"
        font-size="16" font-weight="bold">
        {{LOGO}}
    </text>

    <!-- 感谢语 -->
    <text x="640" y="288" text-anchor="middle" fill="#1A3A5C" font-family="Microsoft YaHei, Arial, sans-serif"
        font-size="50" font-weight="bold">
        {{THANK_YOU}}
    </text>

    <!-- take-home / 副标语 -->
    <text x="640" y="344" text-anchor="middle" fill="#5A6B7B" font-family="Microsoft YaHei, Arial, sans-serif"
        font-size="22">
        {{ENDING_SUBTITLE}}
    </text>

    <!-- 装饰分割线 + 数据节点 -->
    <line x1="470" y1="384" x2="810" y2="384" stroke="#1A3A5C" stroke-width="1.5" />
    <circle cx="640" cy="384" r="6" fill="#0E8C8C" />

    <!-- 致谢 / 利益冲突 / 单位信息卡 -->
    <rect x="340" y="424" width="600" height="150" fill="#F4F7F9" rx="8" />
    <rect x="340" y="424" width="6" height="150" fill="#0E8C8C" rx="3" />
    <text x="640" y="474" text-anchor="middle" fill="#1A3A5C" font-family="Microsoft YaHei, Arial, sans-serif"
        font-size="20" font-weight="bold">
        {{INSTITUTION}}
    </text>
    <text x="640" y="512" text-anchor="middle" fill="#1F2937" font-family="Microsoft YaHei, Arial, sans-serif"
        font-size="16">
        {{DEPARTMENT}}
    </text>
    <text x="640" y="547" text-anchor="middle" fill="#5A6B7B" font-family="Microsoft YaHei, Arial, sans-serif"
        font-size="14">
        {{CONTACT_INFO}}
    </text>

    <!-- 页脚 -->
    <rect x="0" y="672" width="1280" height="48" fill="#F4F7F9" />
    <text x="640" y="702" text-anchor="middle" fill="#9AA7B2" font-family="Microsoft YaHei, Arial, sans-serif"
        font-size="14">
        Disclosure / 利益冲突声明：{{ENDING_SUBTITLE}}
    </text>
    <text x="1220" y="702" text-anchor="end" fill="#9AA7B2" font-family="Microsoft YaHei, Arial, sans-serif"
        font-size="14">
        {{PAGE_NUM}}
    </text>
</svg>
